<section id="popular-product" class="section">
  <div class="container popular-product-container">
    <h2 class="section-title popular-product-title">Наші бестселери</h2>

    <div class="swiper popular-swiper">
      <ul class="swiper-wrapper popular-product-list"></ul>
    </div>

    <div class="popular-swiper-controls">
      <div class="popular-swiper-pagination"></div>

      <div class="popular-swiper-buttons">
        <button
          class="popular-swiper-button-prev"
          type="button"
          aria-label="Попередні товари"
        >
          <svg width="24" height="24">
            <use href="./img/icons.svg#arrow_backicon"></use>
          </svg>
        </button>

        <button
          class="popular-swiper-button-next"
          type="button"
          aria-label="Наступні товари"
        >
          <svg width="24" height="24">
            <use href="./img/icons.svg#arrow_forwardicon"></use>
          </svg>
        </button>
      </div>
    </div>
  </div>
</section>
